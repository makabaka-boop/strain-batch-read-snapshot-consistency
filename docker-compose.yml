services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seqlabels
      POSTGRES_PASSWORD: seqlabels
      POSTGRES_DB: seqlabels
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seqlabels -d seqlabels"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADDR: ":8080"
      DATABASE_URL: "postgres://seqlabels:seqlabels@db:5432/seqlabels?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
